<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="rustTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="slateTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Schematic lines + dots, upper left -->
  <g stroke="#c9bc9d" stroke-width="1" opacity="0.3">
    <line x1="60"  y1="220" x2="380" y2="220"/>
    <line x1="60"  y1="270" x2="320" y2="270"/>
    <line x1="60"  y1="320" x2="420" y2="320"/>
    <line x1="60"  y1="370" x2="280" y2="370"/>
    <line x1="60"  y1="420" x2="360" y2="420"/>
    <line x1="60"  y1="470" x2="220" y2="470"/>
  </g>
  <g fill="#9a3309" opacity="0.5">
    <circle cx="380" cy="220" r="3.5"/>
    <circle cx="320" cy="270" r="3.5"/>
    <circle cx="420" cy="320" r="3.5"/>
    <circle cx="280" cy="370" r="3.5"/>
    <circle cx="360" cy="420" r="3.5"/>
    <circle cx="220" cy="470" r="3.5"/>
  </g>

  <!-- Cube cluster, centered subject -->
  <g transform="translate(380 240)">
    <circle cx="160" cy="160" r="240" fill="url(#glow)" opacity="0.9"/>

    <!-- Back slate cube -->
    <g opacity="0.85">
      <polygon points="40,200 160,140 280,200 160,260" fill="url(#slateTop)"/>
      <polygon points="40,200 40,290 160,350 160,260" fill="#334155"/>
      <polygon points="280,200 280,290 160,350 160,260" fill="#1e293b"/>
    </g>

    <!-- Hero rust cube -->
    <g opacity="0.95">
      <polygon points="80,110 180,55 280,110 180,165" fill="url(#rustTop)"/>
      <polygon points="80,110 80,200 180,255 180,165" fill="url(#rust)"/>
      <polygon points="280,110 280,200 180,255 180,165" fill="#78350f"/>
    </g>

    <!-- LED accents on hero face -->
    <circle cx="115" cy="195" r="6" fill="#fbbf24" opacity="0.95"/>
    <circle cx="138" cy="208" r="6" fill="#fef3ec" opacity="0.7"/>
    <circle cx="161" cy="221" r="6" fill="#fef3ec" opacity="0.7"/>

    <!-- Spark trail leaving the container -->
    <g opacity="0.8" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round">
      <path d="M 280 140 Q 360 110 420 70"/>
    </g>
    <circle cx="420" cy="70"  r="7" fill="#d97706" opacity="0.9"/>
    <circle cx="370" cy="92"  r="4" fill="#d97706" opacity="0.7"/>
    <circle cx="330" cy="115" r="3" fill="#d97706" opacity="0.55"/>
  </g>
</svg>

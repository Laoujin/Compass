<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="rustTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="slateTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Schematic lines + dots, left side -->
  <g stroke="#c9bc9d" stroke-width="1.5" opacity="0.32">
    <line x1="120" y1="260" x2="640" y2="260"/>
    <line x1="120" y1="320" x2="560" y2="320"/>
    <line x1="120" y1="380" x2="700" y2="380"/>
    <line x1="120" y1="440" x2="500" y2="440"/>
    <line x1="120" y1="500" x2="620" y2="500"/>
    <line x1="120" y1="560" x2="420" y2="560"/>
    <line x1="120" y1="620" x2="540" y2="620"/>
  </g>
  <g fill="#9a3309" opacity="0.5">
    <circle cx="640" cy="260" r="4"/>
    <circle cx="560" cy="320" r="4"/>
    <circle cx="700" cy="380" r="4"/>
    <circle cx="500" cy="440" r="4"/>
    <circle cx="620" cy="500" r="4"/>
    <circle cx="420" cy="560" r="4"/>
    <circle cx="540" cy="620" r="4"/>
  </g>

  <!-- Cube cluster, centered subject -->
  <g transform="translate(820 280)">
    <circle cx="220" cy="190" r="320" fill="url(#glow)" opacity="0.9"/>

    <!-- Back slate cube -->
    <g opacity="0.85">
      <polygon points="60,260 220,180 380,260 220,340" fill="url(#slateTop)"/>
      <polygon points="60,260 60,380 220,460 220,340" fill="#334155"/>
      <polygon points="380,260 380,380 220,460 220,340" fill="#1e293b"/>
    </g>

    <!-- Hero rust cube -->
    <g opacity="0.95">
      <polygon points="110,140 240,70 370,140 240,210" fill="url(#rustTop)"/>
      <polygon points="110,140 110,260 240,330 240,210" fill="url(#rust)"/>
      <polygon points="370,140 370,260 240,330 240,210" fill="#78350f"/>
    </g>

    <!-- LED accents on hero face -->
    <circle cx="155" cy="245" r="8" fill="#fbbf24" opacity="0.95"/>
    <circle cx="185" cy="262" r="8" fill="#fef3ec" opacity="0.7"/>
    <circle cx="215" cy="279" r="8" fill="#fef3ec" opacity="0.7"/>

    <!-- Spark trail -->
    <g opacity="0.8" fill="none" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round">
      <path d="M 380 180 Q 480 150 540 100"/>
    </g>
    <circle cx="540" cy="100" r="9" fill="#d97706" opacity="0.9"/>
    <circle cx="480" cy="125" r="5" fill="#d97706" opacity="0.7"/>
    <circle cx="430" cy="148" r="4" fill="#d97706" opacity="0.55"/>
  </g>
</svg>

<!doctype html>
<meta charset="utf-8">
<title>Compass gallery</title>
<link rel="icon" type="image/png" href="/gallery-favicon.png?v=1">
<meta name="description" content="Interactive Compass theme gallery — preview every layout, card and palette combination live.">
<meta property="og:type" content="website">
<meta property="og:title" content="Compass — theme gallery">
<meta property="og:description" content="Preview every Compass layout, card and palette combination live.">
<meta property="og:image" content="/gallery-og.png">
<meta name="twitter:card" content="summary_large_image">
<!--
  Interactive preview shell, served at / by gallery-server.py.
  Layout + card pick a server-rendered build (iframe src = /<skeleton>-<card>/, since v7's
  markup diverges from v1-v6 and can't be CSS-swapped). Palette is pure CSS over shared
  markup, so it's swapped live by rewriting the iframe's palette <link>.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font-family: system-ui, sans-serif; }
  .bar { display: flex; gap: 1.25rem; align-items: flex-end; flex-wrap: wrap;
         padding: .6rem 1rem; border-bottom: 1px solid #ddd; background: #fafafa; }
  .bar strong { font-size: .95rem; align-self: center; margin-right: .5rem; }
  label { display: flex; flex-direction: column; gap: .2rem;
          font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: #777; }
  select { padding: .3rem .4rem; font: inherit; font-size: .85rem; }
  .bar-actions { margin-left: auto; align-self: center; display: flex; gap: .5rem; }
  .bar button { align-self: center; padding: .4rem .7rem;
                font: inherit; font-size: .85rem; border: 1px solid #ccc;
                border-radius: 5px; background: #fff; cursor: pointer; }
  .bar button:hover { background: #f0f0f0; }
  .bar .toggle { flex-direction: row; align-items: center; gap: .4rem;
                 align-self: center; text-transform: none; letter-spacing: 0;
                 font-size: .8rem; color: #444; cursor: pointer; }
  .stage { flex: 1; position: relative; }
  iframe { width: 100%; height: 100%; border: 0; }
  .spinner { position: absolute; inset: 0; display: flex; align-items: center;
             justify-content: center; background: rgba(255, 255, 255, .75); }
  .spinner[hidden] { display: none; }
  .spinner i { width: 36px; height: 36px; border: 4px solid #ddd; border-top-color: #555;
               border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<div class="bar">
  <strong>Compass</strong>
  <label>Layout
    <select id="sk">
      <option value="s1">s1 · Hero + footer</option>
      <option value="s2">s2 · Top bar + footer</option>
      <option value="s3">s3 · Top bar + sidenav</option>
      <option value="s4">s4 · Split hero</option>
      <option value="s5">s5 · Magazine cover</option>
      <option value="s6">s6 · Terminal frame</option>
    </select>
  </label>
  <label>Card
    <select id="cd">
      <option value="v1">v1 · Image-top</option>
      <option value="v2">v2 · Horizontal</option>
      <option value="v3">v3 · Hero overlay</option>
      <option value="v4">v4 · Terminal</option>
      <option value="v5">v5 · Index card</option>
      <option value="v6">v6 · No-image</option>
      <option value="v7">v7 · Compact row</option>
    </select>
  </label>
  <label>Palette
    <select id="pal">
      <option value="rust">Warm rust</option>
      <option value="paper">Paper &amp; ink</option>
      <option value="cartography">Cartography</option>
      <option value="midnight">Midnight</option>
      <option value="minimal">Minimal</option>
      <option value="fieldnotes">Field notes</option>
      <option value="solarized">Solarized</option>
      <option value="nord">Nord</option>
    </select>
  </label>
  <label class="toggle"><input type="checkbox" id="health" checked> Health pill</label>
  <div class="bar-actions">
    <button id="open" type="button" title="Open this layout + card as a standalone page (no selector)">Open ↗</button>
    <button id="refresh" type="button" title="Rebuild the current combo from source (pick up local edits)">↻ Refresh</button>
  </div>
</div>

<div class="stage">
  <iframe id="frame" title="preview"></iframe>
  <div id="spinner" class="spinner" hidden><i></i></div>
</div>

<script>
  var sk = document.getElementById('sk');
  var cd = document.getElementById('cd');
  var pal = document.getElementById('pal');
  var frame = document.getElementById('frame');
  var spinner = document.getElementById('spinner');
  var refresh = document.getElementById('refresh');
  var openBtn = document.getElementById('open');
  var health = document.getElementById('health');

  // Reflect the current selection in the tab title so you know what you're viewing.
  function updateTitle() {
    document.title = sk.value + ' · ' + cd.value + ' · ' + pal.value + ' — Compass';
  }

  // Layout + card => reload the matching server build (~1.5s rebuild). Show the
  // spinner until the new combo finishes loading.
  function loadCombo() { updateTitle(); spinner.hidden = false; frame.src = '/' + sk.value + '-' + cd.value + '/'; }

  // Palette => rewrite the iframe's palette stylesheet link in place (no reload).
  function applyPalette() {
    var doc;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    var links = doc.querySelectorAll('link[rel="stylesheet"]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href') || '';
      if (href.indexOf('/palettes/') !== -1) {
        links[i].setAttribute('href', href.replace(/\/palettes\/[^/]+\.css/, '/palettes/' + pal.value + '.css'));
        return;
      }
    }
  }

  // Health pill => show/hide it in the iframe (no reload; the pill is server-rendered
  // from _data/health.json, so this just toggles its visibility for previewing).
  function applyHealth() {
    var doc;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    var pills = doc.querySelectorAll('.atlas-health');
    for (var i = 0; i < pills.length; i++) pills[i].style.display = health.checked ? '' : 'none';
  }

  sk.addEventListener('change', loadCombo);
  cd.addEventListener('change', loadCombo);
  pal.addEventListener('change', function () { applyPalette(); updateTitle(); });
  health.addEventListener('change', applyHealth);
  // Refresh => re-request the same combo so the server rebuilds it from current
  // source (picks up local edits). reload() forces it even though the URL is unchanged.
  refresh.addEventListener('click', function () {
    spinner.hidden = false;
    frame.contentWindow.location.reload();
  });
  // Open the current combo on its own — the standalone Atlas page, no selector.
  openBtn.addEventListener('click', function () {
    window.open('/' + sk.value + '-' + cd.value + '/', '_blank', 'noopener');
  });
  // Combo finished loading (or failed): hide spinner, re-apply palette + health toggle.
  frame.addEventListener('load', function () { spinner.hidden = true; applyPalette(); applyHealth(); });

  loadCombo();
</script>

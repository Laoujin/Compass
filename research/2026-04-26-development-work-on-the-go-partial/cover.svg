<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a09"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Phone (dimmed) -->
  <g transform="translate(290,80)" opacity="0.85">
    <rect width="120" height="240" rx="18" fill="#1c1917" stroke="#57534e" stroke-width="3"/>
    <rect x="10" y="30" width="100" height="180" rx="4" fill="#0c0a09"/>
    <rect x="20"  y="50"  width="70" height="20" rx="10" fill="#fb923c"/>
    <rect x="34"  y="80"  width="60" height="18" rx="9"  fill="#44403c"/>
    <rect x="20"  y="108" width="80" height="20" rx="10" fill="#fb923c"/>
    <rect x="40"  y="138" width="50" height="18" rx="9"  fill="#44403c"/>
    <circle cx="60" cy="22" r="3" fill="#57534e"/>
  </g>
  <!-- timeout/warning glyph -->
  <g transform="translate(430,200)">
    <polygon points="60,0 120,110 0,110" fill="#f59e0b" stroke="#fbbf24" stroke-width="3"/>
    <text x="60" y="78" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui" font-weight="800" font-size="56">!</text>
  </g>
  <!-- broken/dashed wire -->
  <g stroke="#fb923c" stroke-width="3" fill="none" opacity="0.7" stroke-dasharray="6 6">
    <path d="M120 280 Q220 240 290 320"/>
  </g>
</svg>

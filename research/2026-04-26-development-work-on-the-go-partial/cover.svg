<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a09"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Same code-rain decoration but in muted amber, with timeout signals -->
  <g fill="#fb923c" opacity="0.14" font-family="ui-monospace, monospace" font-size="16">
    <text x="40"  y="60"  >gh pr create</text>
    <text x="40"  y="120" >git push origin</text>
    <text x="40"  y="180" >TIMEOUT after 4h</text>
    <text x="40"  y="240" >atlas-checkout/</text>
    <text x="40"  y="300" >scout/run.sh</text>
    <text x="40"  y="360" >EXIT 124</text>
    <text x="40"  y="420" >caddy reload</text>
    <text x="40"  y="480" >gh issue stays open</text>
    <text x="40"  y="540" >run-decompose</text>
    <text x="40"  y="600" >2 of 3 succeeded</text>
    <text x="40"  y="660" >dns add A *</text>
    <text x="40"  y="720" >restart proxy</text>
    <text x="40"  y="780" >tail -f logs</text>
    <text x="40"  y="840" >scout/sharpen</text>
    <text x="1280" y="60"  >gh pr checks</text>
    <text x="1280" y="120" >2026-04-26</text>
    <text x="1280" y="180" >atlas push</text>
    <text x="1280" y="240" >run-decompose</text>
    <text x="1280" y="300" >TIMEOUT after 4h</text>
    <text x="1280" y="360" >slack:thread</text>
    <text x="1280" y="420" >ec2-stop</text>
    <text x="1280" y="480" >hyper-v on</text>
    <text x="1280" y="540" >dnsmasq</text>
    <text x="1280" y="600" >EXIT 124</text>
    <text x="1280" y="660" >prometheus</text>
    <text x="1280" y="720" >tailscale up</text>
    <text x="1280" y="780" >restic backup</text>
    <text x="1280" y="840" >gh release</text>
  </g>
  <!-- Phone (dimmed, partial signal) -->
  <g transform="translate(640,200)" opacity="0.85">
    <rect width="200" height="500" rx="32" fill="#1c1917" stroke="#57534e" stroke-width="5"/>
    <rect x="16" y="50" width="168" height="390" rx="8" fill="#0c0a09"/>
    <rect x="32"  y="80"  width="120" height="32" rx="16" fill="#fb923c"/>
    <rect x="60"  y="124" width="100" height="30" rx="15" fill="#44403c"/>
    <rect x="32"  y="166" width="140" height="32" rx="16" fill="#fb923c"/>
    <rect x="68"  y="210" width="84"  height="30" rx="15" fill="#44403c"/>
    <rect x="32"  y="252" width="115" height="32" rx="16" fill="#fb923c"/>
    <rect x="56"  y="296" width="92"  height="30" rx="15" fill="#44403c"/>
    <rect x="32"  y="338" width="130" height="32" rx="16" fill="#fb923c"/>
    <rect x="60"  y="382" width="80"  height="30" rx="15" fill="#44403c"/>
    <circle cx="100" cy="36" r="5" fill="#57534e"/>
    <rect x="60" y="464" width="80" height="5" rx="3" fill="#57534e"/>
  </g>
  <!-- Warning triangle (centered subject, big) -->
  <g transform="translate(940,360)">
    <polygon points="140,0 280,240 0,240" fill="#f59e0b" stroke="#fbbf24" stroke-width="6"/>
    <text x="140" y="190" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui" font-weight="800" font-size="140">!</text>
  </g>
  <!-- Broken/dashed wires -->
  <g stroke="#fb923c" stroke-width="5" fill="none" opacity="0.65" stroke-dasharray="10 10">
    <path d="M280 660 Q400 580 540 700"/>
    <path d="M1180 720 Q1320 800 1460 700"/>
  </g>
</svg>

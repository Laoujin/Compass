<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#831843"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Confetti spread, full bleed -->
  <g opacity="0.7">
    <circle cx="180"  cy="120" r="9" fill="#fbbf24"/>
    <circle cx="1420" cy="140" r="7" fill="#f9a8d4"/>
    <circle cx="200"  cy="780" r="9" fill="#fde047"/>
    <circle cx="1440" cy="800" r="8" fill="#f472b6"/>
    <circle cx="120"  cy="450" r="6" fill="#fbbf24"/>
    <circle cx="1480" cy="480" r="7" fill="#fde047"/>
    <rect x="380"  y="80"  width="11" height="18" fill="#fbbf24" transform="rotate(20 386 89)"/>
    <rect x="1100" y="60"  width="11" height="18" fill="#f9a8d4" transform="rotate(-15 1106 69)"/>
    <rect x="160"  y="280" width="11" height="18" fill="#fde047" transform="rotate(35 166 289)"/>
    <rect x="1440" y="320" width="11" height="18" fill="#f472b6" transform="rotate(-25 1446 329)"/>
    <rect x="380"  y="800" width="11" height="18" fill="#fbbf24" transform="rotate(45 386 809)"/>
    <rect x="1180" y="780" width="11" height="18" fill="#f9a8d4" transform="rotate(-30 1186 789)"/>
    <circle cx="700"  cy="100" r="5" fill="#fbbf24"/>
    <circle cx="900"  cy="120" r="6" fill="#fde047"/>
  </g>
  <!-- Gift box hero, centered -->
  <g transform="translate(580,210)">
    <!-- box body -->
    <rect x="0" y="140" width="440" height="340" rx="14" fill="#f9a8d4" stroke="#fce7f3" stroke-width="3"/>
    <!-- vertical ribbon -->
    <rect x="200" y="140" width="44" height="340" fill="#dc2626"/>
    <!-- box lid -->
    <rect x="-22" y="92" width="484" height="78" rx="9" fill="#fbcfe8" stroke="#fce7f3" stroke-width="3"/>
    <rect x="200" y="92" width="44" height="78" fill="#dc2626"/>
    <!-- bow -->
    <g transform="translate(222,92)">
      <ellipse cx="-54" cy="0" rx="68" ry="48" fill="#dc2626"/>
      <ellipse cx="54"  cy="0" rx="68" ry="48" fill="#dc2626"/>
      <ellipse cx="-54" cy="0" rx="44" ry="26" fill="#b91c1c"/>
      <ellipse cx="54"  cy="0" rx="44" ry="26" fill="#b91c1c"/>
      <circle cx="0" cy="0" r="24" fill="#7f1d1d"/>
      <!-- ribbon trails -->
      <path d="M-22 22 Q-36 60 -12 96 Q-26 132 0 156" fill="none" stroke="#dc2626" stroke-width="7"/>
      <path d="M22 22 Q36 60 12 96 Q26 132 0 156" fill="none" stroke="#dc2626" stroke-width="7"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Stacked source cards fanning out, hero centered -->
  <g transform="translate(540,200)">
    <g transform="rotate(-10 250 250)">
      <rect width="380" height="500" rx="16" fill="#312e81" stroke="#a78bfa" stroke-width="3"/>
      <g fill="#c4b5fd" opacity="0.9">
        <rect x="40" y="56" width="300" height="11" rx="5"/>
        <rect x="40" y="92" width="260" height="7"  rx="3"/>
        <rect x="40" y="112" width="280" height="7" rx="3"/>
        <rect x="40" y="132" width="240" height="7" rx="3"/>
        <rect x="40" y="180" width="300" height="11" rx="5"/>
        <rect x="40" y="216" width="240" height="7" rx="3"/>
        <rect x="40" y="236" width="270" height="7" rx="3"/>
        <rect x="40" y="284" width="300" height="11" rx="5"/>
        <rect x="40" y="320" width="220" height="7" rx="3"/>
      </g>
    </g>
    <g transform="rotate(6 250 250) translate(80 -30)">
      <rect width="380" height="500" rx="16" fill="#4338ca" stroke="#c4b5fd" stroke-width="3"/>
      <g fill="#ede9fe" opacity="0.95">
        <rect x="40" y="56" width="300" height="11" rx="5"/>
        <rect x="40" y="92" width="280" height="7"  rx="3"/>
        <rect x="40" y="112" width="250" height="7" rx="3"/>
        <rect x="40" y="132" width="270" height="7" rx="3"/>
        <rect x="40" y="180" width="300" height="11" rx="5"/>
        <rect x="40" y="216" width="240" height="7" rx="3"/>
        <rect x="40" y="236" width="260" height="7" rx="3"/>
        <rect x="40" y="284" width="300" height="11" rx="5"/>
        <rect x="40" y="320" width="200" height="7" rx="3"/>
      </g>
    </g>
  </g>

  <!-- Magnifying glass hero, centered band -->
  <g transform="translate(1020,560)">
    <circle r="160" fill="#fef3c7" opacity="0.12"/>
    <circle r="160" fill="none" stroke="#fbbf24" stroke-width="18"/>
    <circle r="140" fill="none" stroke="#fde047" stroke-width="2" opacity="0.5"/>
    <line x1="115" y1="115" x2="240" y2="240" stroke="#fbbf24" stroke-width="28" stroke-linecap="round"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#fbbf24" stroke-width="3" opacity="0.4"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#fbbf24" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Floating bullet dots framing the comp -->
  <g fill="#a78bfa" opacity="0.55">
    <circle cx="180" cy="160" r="5"/>
    <circle cx="240" cy="200" r="3"/>
    <circle cx="1420" cy="180" r="6"/>
    <circle cx="1460" cy="240" r="4"/>
    <circle cx="160"  cy="700" r="4"/>
    <circle cx="1400" cy="760" r="5"/>
  </g>
</svg>

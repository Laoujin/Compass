<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Code rain (decorative, full bleed) -->
  <g fill="#22d3ee" opacity="0.16" font-family="ui-monospace, monospace" font-size="16">
    <text x="40"  y="60"  >gh pr create</text>
    <text x="40"  y="120" >git push origin</text>
    <text x="40"  y="180" >docker compose up</text>
    <text x="40"  y="240" >atlas-checkout/</text>
    <text x="40"  y="300" >scout/run.sh</text>
    <text x="40"  y="360" >ssh nas:/srv/</text>
    <text x="40"  y="420" >caddy reload</text>
    <text x="40"  y="480" >gh issue close</text>
    <text x="40"  y="540" >run-decompose</text>
    <text x="40"  y="600" >slack:approve</text>
    <text x="40"  y="660" >dns add A *</text>
    <text x="40"  y="720" >restart proxy</text>
    <text x="40"  y="780" >tail -f logs</text>
    <text x="40"  y="840" >scout/sharpen</text>
    <!-- Right column too -->
    <text x="1280" y="60"  >gh pr checks</text>
    <text x="1280" y="120" >2026-04-26</text>
    <text x="1280" y="180" >atlas push</text>
    <text x="1280" y="240" >run-decompose</text>
    <text x="1280" y="300" >gh api</text>
    <text x="1280" y="360" >slack:thread</text>
    <text x="1280" y="420" >ec2-stop</text>
    <text x="1280" y="480" >hyper-v on</text>
    <text x="1280" y="540" >dnsmasq</text>
    <text x="1280" y="600" >wireguard</text>
    <text x="1280" y="660" >prometheus</text>
    <text x="1280" y="720" >tailscale up</text>
    <text x="1280" y="780" >restic backup</text>
    <text x="1280" y="840" >gh release</text>
  </g>
  <!-- Phone (centered subject, prominent) -->
  <g transform="translate(700,200)">
    <rect width="200" height="500" rx="32" fill="#1e293b" stroke="#475569" stroke-width="5"/>
    <rect x="16" y="50" width="168" height="390" rx="8" fill="#0f172a"/>
    <rect x="32"  y="80"  width="120" height="32" rx="16" fill="#22d3ee"/>
    <rect x="60"  y="124" width="100" height="30" rx="15" fill="#334155"/>
    <rect x="32"  y="166" width="140" height="32" rx="16" fill="#22d3ee"/>
    <rect x="68"  y="210" width="84"  height="30" rx="15" fill="#a78bfa"/>
    <rect x="32"  y="252" width="115" height="32" rx="16" fill="#22d3ee"/>
    <rect x="56"  y="296" width="92"  height="30" rx="15" fill="#334155"/>
    <rect x="32"  y="338" width="130" height="32" rx="16" fill="#22d3ee"/>
    <rect x="60"  y="382" width="80"  height="30" rx="15" fill="#a78bfa"/>
    <circle cx="100" cy="36" r="5" fill="#475569"/>
    <rect x="60" y="464" width="80" height="5" rx="3" fill="#475569"/>
  </g>
  <!-- Laptop (right of phone) -->
  <g transform="translate(960,440)">
    <rect width="320" height="200" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="10" y="10" width="300" height="180" rx="4" fill="#0f172a"/>
    <g fill="#22d3ee" opacity="0.8">
      <rect x="26" y="28"  width="120" height="5"/>
      <rect x="26" y="44"  width="160" height="5"/>
      <rect x="42" y="60"  width="80"  height="5"/>
      <rect x="42" y="76"  width="140" height="5"/>
      <rect x="26" y="92"  width="100" height="5"/>
      <rect x="26" y="108" width="180" height="5"/>
      <rect x="42" y="124" width="120" height="5" fill="#a78bfa"/>
      <rect x="26" y="140" width="200" height="5"/>
      <rect x="26" y="156" width="80"  height="5"/>
      <rect x="26" y="172" width="140" height="5"/>
    </g>
    <path d="M-20 200 L340 200 L320 220 L0 220 Z" fill="#475569"/>
  </g>
</svg>

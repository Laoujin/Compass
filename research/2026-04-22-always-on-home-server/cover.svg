<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- subtle circuit grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <path d="M0 80 H600 M0 160 H600 M0 240 H600 M0 320 H600"/>
    <path d="M80 0 V400 M160 0 V400 M240 0 V400 M320 0 V400 M400 0 V400 M480 0 V400"/>
  </g>
  <!-- server rack -->
  <g transform="translate(370,70)">
    <rect width="180" height="260" rx="8" fill="url(#rack)" stroke="#475569" stroke-width="2"/>
    <!-- 6 1U units -->
    <g fill="#0f172a" stroke="#475569">
      <rect x="14" y="14"  width="152" height="32" rx="3"/>
      <rect x="14" y="54"  width="152" height="32" rx="3"/>
      <rect x="14" y="94"  width="152" height="32" rx="3"/>
      <rect x="14" y="134" width="152" height="32" rx="3"/>
      <rect x="14" y="174" width="152" height="32" rx="3"/>
      <rect x="14" y="214" width="152" height="32" rx="3"/>
    </g>
    <!-- LEDs -->
    <g>
      <circle cx="28" cy="30"  r="3" fill="#22c55e"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="28" cy="70"  r="3" fill="#22c55e"/>
      <circle cx="28" cy="110" r="3" fill="#f59e0b"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="28" cy="150" r="3" fill="#22c55e"/>
      <circle cx="28" cy="190" r="3" fill="#22c55e"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="28" cy="230" r="3" fill="#64748b"/>
    </g>
  </g>
  <!-- decorative chip -->
  <g transform="translate(60,170)" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.7">
    <rect x="0" y="0" width="80" height="80" rx="6"/>
    <rect x="20" y="20" width="40" height="40" rx="2" fill="#1e3a5f"/>
    <path d="M0 30 H-12 M0 50 H-12 M80 30 H92 M80 50 H92 M30 0 V-12 M50 0 V-12 M30 80 V92 M50 80 V92"/>
  </g>
</svg>

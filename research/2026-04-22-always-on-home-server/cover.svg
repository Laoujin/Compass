<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- subtle circuit grid (full bleed) -->
  <g stroke="#334155" stroke-width="1" opacity="0.32">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800 M0 600 H800 M0 700 H800"/>
    <path d="M100 0 V800 M200 0 V800 M300 0 V800 M400 0 V800 M500 0 V800 M600 0 V800 M700 0 V800"/>
  </g>
  <!-- chip on the left (decorative, gets cropped on cards but visible on detail) -->
  <g transform="translate(60,300)" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.65">
    <rect x="0" y="0" width="140" height="140" rx="10"/>
    <rect x="35" y="35" width="70" height="70" rx="4" fill="#1e3a5f"/>
    <path d="M0 50 H-20 M0 90 H-20 M140 50 H160 M140 90 H160 M50 0 V-20 M90 0 V-20 M50 140 V160 M90 140 V160"/>
  </g>
  <!-- server rack (centered subject — survives 3:2 card crop) -->
  <g transform="translate(280,140)">
    <rect width="280" height="500" rx="14" fill="url(#rack)" stroke="#475569" stroke-width="3"/>
    <!-- 8 1U units -->
    <g fill="#0f172a" stroke="#475569" stroke-width="1.5">
      <rect x="22" y="22"  width="236" height="48" rx="4"/>
      <rect x="22" y="82"  width="236" height="48" rx="4"/>
      <rect x="22" y="142" width="236" height="48" rx="4"/>
      <rect x="22" y="202" width="236" height="48" rx="4"/>
      <rect x="22" y="262" width="236" height="48" rx="4"/>
      <rect x="22" y="322" width="236" height="48" rx="4"/>
      <rect x="22" y="382" width="236" height="48" rx="4"/>
      <rect x="22" y="442" width="236" height="48" rx="4"/>
    </g>
    <!-- LEDs (left column) -->
    <g>
      <circle cx="44" cy="46"  r="5" fill="#22c55e"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="44" cy="106" r="5" fill="#22c55e"/>
      <circle cx="44" cy="166" r="5" fill="#f59e0b"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="44" cy="226" r="5" fill="#22c55e"/>
      <circle cx="44" cy="286" r="5" fill="#22c55e"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="44" cy="346" r="5" fill="#64748b"/>
      <circle cx="44" cy="406" r="5" fill="#22c55e"/>
      <circle cx="44" cy="466" r="5" fill="#ef4444"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" repeatCount="indefinite"/></circle>
    </g>
    <!-- horizontal "drive bay" lines (right side) -->
    <g stroke="#475569" stroke-width="1" opacity="0.6">
      <path d="M80 46 H240 M80 106 H240 M80 166 H240 M80 226 H240 M80 286 H240 M80 346 H240 M80 406 H240 M80 466 H240"/>
    </g>
  </g>
  <!-- power-cord glyph bottom right -->
  <g transform="translate(620,560)" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.55">
    <path d="M0 100 Q40 60 80 100 T160 100"/>
    <circle cx="0" cy="100" r="5" fill="#22d3ee"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Circuit grid full bleed -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600 M0 400 H1600 M0 500 H1600 M0 600 H1600 M0 700 H1600 M0 800 H1600"/>
    <path d="M100 0 V900 M250 0 V900 M400 0 V900 M550 0 V900 M700 0 V900 M850 0 V900 M1000 0 V900 M1150 0 V900 M1300 0 V900 M1450 0 V900"/>
  </g>
  <!-- Decorative chip on left -->
  <g transform="translate(180,360)" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.6">
    <rect x="0" y="0" width="160" height="160" rx="12"/>
    <rect x="40" y="40" width="80" height="80" rx="6" fill="#1e3a5f"/>
    <path d="M0 60 H-22 M0 100 H-22 M160 60 H182 M160 100 H182 M60 0 V-22 M100 0 V-22 M60 160 V182 M100 160 V182"/>
  </g>
  <!-- Server rack — hero centered around (800, 450) -->
  <g transform="translate(620,200)">
    <rect width="360" height="500" rx="16" fill="url(#rack)" stroke="#475569" stroke-width="3"/>
    <g fill="#0f172a" stroke="#475569" stroke-width="1.5">
      <rect x="26" y="26"  width="308" height="48" rx="4"/>
      <rect x="26" y="86"  width="308" height="48" rx="4"/>
      <rect x="26" y="146" width="308" height="48" rx="4"/>
      <rect x="26" y="206" width="308" height="48" rx="4"/>
      <rect x="26" y="266" width="308" height="48" rx="4"/>
      <rect x="26" y="326" width="308" height="48" rx="4"/>
      <rect x="26" y="386" width="308" height="48" rx="4"/>
      <rect x="26" y="446" width="308" height="48" rx="4"/>
    </g>
    <!-- LEDs -->
    <g>
      <circle cx="50" cy="50"  r="6" fill="#22c55e"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="110" r="6" fill="#22c55e"/>
      <circle cx="50" cy="170" r="6" fill="#f59e0b"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="230" r="6" fill="#22c55e"/>
      <circle cx="50" cy="290" r="6" fill="#22c55e"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="350" r="6" fill="#64748b"/>
      <circle cx="50" cy="410" r="6" fill="#22c55e"/>
      <circle cx="50" cy="470" r="6" fill="#ef4444"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" repeatCount="indefinite"/></circle>
    </g>
    <!-- Drive bay lines on the right of each unit -->
    <g stroke="#475569" stroke-width="1" opacity="0.6">
      <path d="M86 50 H310 M86 110 H310 M86 170 H310 M86 230 H310 M86 290 H310 M86 350 H310 M86 410 H310 M86 470 H310"/>
    </g>
  </g>
  <!-- Power-cord glyph bottom right -->
  <g transform="translate(1180,640)" fill="none" stroke="#22d3ee" stroke-width="3.5" opacity="0.55">
    <path d="M0 80 Q50 30 110 80 T220 80"/>
    <circle cx="0" cy="80" r="6" fill="#22d3ee"/>
  </g>
  <!-- Status nodes upper right -->
  <g transform="translate(1280,200)" fill="#22d3ee" opacity="0.5">
    <circle cx="0"  cy="0" r="5"/>
    <circle cx="40" cy="20" r="3"/>
    <circle cx="80" cy="0" r="4"/>
    <path d="M0 0 L40 20 L80 0" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
</svg>

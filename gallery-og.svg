    <polygon points="0,-26 5,0 -5,0" fill="#b5532e"/>
    <polygon points="0,26 5,0 -5,0" fill="#6b6257"/>
    <circle cx="0" cy="0" r="3.5" fill="#fff8ec" stroke="#2a2622" stroke-width="1.6"/>
  </g>
  <!-- title -->
  <text x="560" y="300" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="120" fill="#2a2622">Compass</text>
  <text x="562" y="370" font-family="system-ui, sans-serif" font-size="34" fill="#6b6257">Theme gallery</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f4ecdf"/>
  <rect width="1200" height="630" fill="none" stroke="#2a2622" stroke-width="16"/>
  <!-- compass rose, left -->
  <g transform="translate(300 315) scale(4.2)">
    <circle cx="0" cy="0" r="30" fill="#fff8ec" stroke="#2a2622" stroke-width="3"/>
    <polygon points="-26,0 0,-4 0,4" fill="#8a7f70"/>

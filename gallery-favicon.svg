<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Compass rose: cream disc, dark ring, rust north needle -->
  <circle cx="32" cy="32" r="30" fill="#f4ecdf" stroke="#2a2622" stroke-width="3"/>
  <!-- horizontal needle (W/E), behind -->
  <polygon points="6,32 32,28 32,36" fill="#8a7f70"/>
  <polygon points="58,32 32,28 32,36" fill="#3a342e"/>
  <!-- vertical needle (N rust / S muted) -->
  <polygon points="32,6 37,32 27,32" fill="#b5532e"/>
  <polygon points="32,58 37,32 27,32" fill="#6b6257"/>
  <circle cx="32" cy="32" r="3.5" fill="#f4ecdf" stroke="#2a2622" stroke-width="1.6"/>
</svg>
